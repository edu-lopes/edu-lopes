name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: edu-lopes
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg

      - name: Push generated files
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update snake contribution graph"
          add: "dist"
