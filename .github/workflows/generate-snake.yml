name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona o repositório (obrigatório)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Gera o snake
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: edu-lopes
          outputs: dist/snake-dark.svg
          color_snake: "#58a6ff"
          color_dots: |
          0:#0d1117   # fundo GitHub
          1:#161b22   # célula vazia
          2:#21262d   # baixa atividade
          3:#30363d   # média atividade
          4:#484f58   # alta atividade (sem branco)

      # 3️⃣ Commit automático
      - name: Commit generated snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update snake contribution graph"
          add: "dist"
